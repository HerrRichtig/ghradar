[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghradar"
version = "0.1.0"
description = "Periodically-updated GitHub project retriever with hybrid semantic + keyword search"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.8",
    "mcp>=2.0",
    "requests>=2.31",
    "numpy>=1.26",
    "tqdm>=4.66",
]

[project.scripts]
ghradar = "ghradar.cli:main"
ghradar-mcp = "ghradar.mcp_server:main"

[tool.setuptools.packages.find]
include = ["ghradar*"]
